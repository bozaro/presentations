<svg xmlns="http://www.w3.org/2000/svg" width="824" height="170" viewBox="0 0 824 170" role="img">
  <title>Повторное чтение событий после восстановления игрового сервера</title>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#2866a0" stroke-width="1.5"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#303846;font-size:18px;text-anchor:middle}.title{font-size:21px;font-weight:700}</style>
  <rect x="4" y="20" width="220" height="120" rx="9" fill="#f3f6fa" stroke="#adb7c4" stroke-width="1.5"/>
  <text x="114" y="51" class="title">Журнал событий</text>
  <text x="114" y="80">Покупки после t0</text>
  <text x="114" y="112">№42 → №43 → …</text>
  <path d="M224 85 H363" fill="none" stroke="#2866a0" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="294" y="64" style="fill:#2866a0">Повтор чтения</text>
  <rect x="365" y="20" width="240" height="120" rx="9" fill="#f3f6fa" stroke="#2866a0" stroke-width="3"/>
  <text x="485" y="51" class="title">Игровой сервер 1</text>
  <text x="485" y="80">Покупки: t0 → t1</text>
  <text x="485" y="112">Из копии + события</text>
  <path d="M630 20 V140" stroke="#adb7c4" stroke-dasharray="5 5"/>
  <text x="731" y="43" class="title" style="fill:#24856b">Без отката</text>
  <text x="731" y="73">Биллинг и банк</text>
  <text x="731" y="103">Серверы 2 и 3</text>
  <text x="731" y="133">остаются в t1</text>
</svg>
